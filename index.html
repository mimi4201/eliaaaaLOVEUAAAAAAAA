<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1030">
<title>Для Эли</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
:root{--red:#e23636;--blue:#1a3b9c;--navy:#0a1030;--yellow:#ffd60a;--white:#fffdf5}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{min-height:100vh;min-height:100dvh}
body{background:var(--navy);color:var(--white);font-family:'Comic Neue','Comic Sans MS',system-ui,sans-serif;font-weight:700;font-size:20px;overflow-x:hidden;
  background-image:radial-gradient(rgba(226,54,54,.28) 2px,transparent 2.5px),radial-gradient(rgba(26,59,156,.55) 2px,transparent 2.5px);
  background-size:22px 22px;background-position:0 0,11px 11px}
.web{position:fixed;width:min(60vw,300px);height:auto;z-index:1;opacity:.55;pointer-events:none}
.web.tl{top:0;left:0}
.web.br{bottom:0;right:0;transform:rotate(180deg)}
.web path{fill:none;stroke:var(--white);stroke-width:1.4}

.thread{position:fixed;top:0;right:12%;z-index:3;width:2px;height:150px;background:var(--white);transform-origin:top;animation:swing 3.4s ease-in-out infinite;pointer-events:none}
.thread span{position:absolute;bottom:-26px;left:-15px;font-size:32px;filter:drop-shadow(0 0 6px #000)}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}

#fx{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.pop{position:absolute;top:-30px;animation:fall linear forwards;text-shadow:2px 2px 0 var(--navy)}
@keyframes fall{to{transform:translateY(112vh) rotate(60deg)}}

.screen{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;
  padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(36px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.comic{font-family:'Bangers','Impact',sans-serif;letter-spacing:.04em;font-weight:400}

/* intro */
#intro h1{font-size:clamp(44px,13vw,104px);line-height:.95;color:var(--yellow);
  -webkit-text-stroke:3px var(--navy);paint-order:stroke fill;text-shadow:6px 6px 0 var(--red);transform:rotate(-3deg);animation:shake 2.4s infinite}
@keyframes shake{0%,86%,100%{transform:rotate(-3deg)}90%{transform:rotate(-1deg) translateX(-5px)}94%{transform:rotate(-5deg) translateX(5px)}}
.sense{position:relative;width:150px;height:150px;display:grid;place-items:center;font-size:64px}
.sense i{position:absolute;inset:0;border:4px solid var(--white);border-radius:50%;opacity:0;animation:ring 1.8s infinite}
.sense i:nth-child(2){animation-delay:.6s}.sense i:nth-child(3){animation-delay:1.2s}
@keyframes ring{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.bubble{position:relative;background:var(--white);color:var(--navy);padding:14px 22px;border:4px solid var(--navy);border-radius:50%/60%;box-shadow:5px 5px 0 var(--red)}
.bubble::after{content:"";position:absolute;bottom:-18px;left:50%;border:10px solid transparent;border-top:16px solid var(--navy)}

button{font-family:'Bangers','Impact',sans-serif;font-size:28px;letter-spacing:.08em;color:var(--white);background:var(--red);border:4px solid var(--navy);
  padding:16px 38px;min-height:56px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;box-shadow:6px 6px 0 var(--blue);transform:skewX(-8deg);transition:transform .12s,box-shadow .12s}
@media(hover:hover){button:hover{transform:skewX(-8deg) translate(-2px,-2px);box-shadow:9px 9px 0 var(--blue)}}
button:active{transform:skewX(-8deg) translate(4px,4px);box-shadow:2px 2px 0 var(--blue)}
button:focus-visible{outline:4px solid var(--yellow);outline-offset:4px}

/* card */
#card{display:none}
#card.show{display:flex;animation:bam .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes bam{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.title{font-size:clamp(40px,11vw,76px);line-height:1;color:var(--white);-webkit-text-stroke:3px var(--navy);paint-order:stroke fill;text-shadow:5px 5px 0 var(--red)}
.panel{position:relative;width:min(72vw,320px);aspect-ratio:1;background:var(--white);padding:10px;border:5px solid var(--navy);transform:rotate(-3deg);box-shadow:10px 10px 0 var(--red)}
.panel img{width:100%;height:100%;object-fit:cover;display:block;border:3px solid var(--navy)}
.panel::after{content:"";position:absolute;inset:10px;pointer-events:none;border:3px solid transparent;
  background:radial-gradient(rgba(226,54,54,.4) 1.5px,transparent 2px) 0 0/8px 8px;-webkit-mask:linear-gradient(135deg,transparent 70%,#000);mask:linear-gradient(135deg,transparent 70%,#000)}
.sfx{position:absolute;right:-18px;top:-26px;font-size:40px;color:var(--yellow);-webkit-text-stroke:2px var(--navy);paint-order:stroke fill;transform:rotate(14deg);text-shadow:3px 3px 0 var(--red);animation:throb 1.2s infinite}
@keyframes throb{50%{transform:rotate(14deg) scale(1.15)}}
.caption{width:100%;max-width:540px;min-height:11em;background:var(--yellow);color:var(--navy);padding:18px 22px;border:4px solid var(--navy);box-shadow:7px 7px 0 var(--blue);text-align:left;line-height:1.4;font-size:clamp(18px,4.5vw,23px)}
.cursor{display:inline-block;width:9px;height:1em;background:var(--red);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--blue);border:3px solid var(--white);padding:6px 14px;font-size:17px;transform:rotate(-1.5deg)}
.chip:nth-child(2){transform:rotate(1.5deg);background:var(--red)}
.foot{font-size:15px;opacity:.85}
@media(max-width:380px){.screen{gap:18px}.chip{font-size:15px;padding:5px 10px}.thread{height:110px;right:8%}button{font-size:24px;padding:14px 28px}}
@media(max-height:640px){.sense{width:100px;height:100px;font-size:44px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

<script>
var TEXT = "Эля, ты лучшее, что со мной случилось. Во всех вселенных, в каждой реальности я бы снова выбрала тебя. " +
  "Тебе не нужны суперсилы, ты и так самая невероятная. Моё паучье чутьё всегда ведёт меня к тебе. Я тебя люблю!";

var fx = document.getElementById('fx');
var ICONS = ['❤','🕸️','💙','❤','⭐','🕷️'];
function spawn(n){
  for(var i=0;i<n;i++){
    var d=document.createElement('div');
    d.className='pop';
    d.textContent=ICONS[Math.floor(Math.random()*ICONS.length)];
    d.style.left=Math.random()*100+'vw';
    d.style.fontSize=(16+Math.random()*26)+'px';
    d.style.color=Math.random()>.5?'#e23636':'#4c7dff';
    d.style.animationDuration=(4+Math.random()*5)+'s';
    fx.appendChild(d);
    (function(el){setTimeout(function(){el.remove()},9500)})(d);
  }
}
function typeText(){
  var el=document.getElementById('typed'),i=0;
  (function step(){
    if(i<=TEXT.length){el.textContent=TEXT.slice(0,i++);setTimeout(step,45)}
  })();
}
document.getElementById('open').onclick=function(){
  document.getElementById('intro').style.display='none';
  document.getElementById('card').classList.add('show');
  window.scrollTo(0,0);
  spawn(30);
  setInterval(function(){spawn(2)},1000);
  setTimeout(typeText,600);
};
document.getElementById('boost').onclick=function(){spawn(50)};
</script>
